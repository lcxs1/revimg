[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "revimg"
version = "1.0.0"
description = "Damage-tolerant reversible image scramble: an image that stays viewable, decrypts with a key, and degrades only where it was damaged"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "revimg contributors" }]
keywords = ["image", "encryption", "watermark", "erasure-code", "fountain-code", "jpeg", "robust"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security :: Cryptography",
]
dependencies = ["numpy>=1.23", "Pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["tkinterdnd2>=0.7"]

[project.scripts]
revimg = "revimg.cli:main"

[project.gui-scripts]
revimg-gui = "revimg.gui:main"

[tool.setuptools]
packages = ["revimg"]
