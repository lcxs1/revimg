name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: python -m pip install --upgrade pip && python -m pip install -r packaging/requirements-build.txt

      # The acceptance gate runs in ci.yml on every push; this job only needs
      # the fast suite to prove the tree is packageable.
      - name: Fast tests
        run: python -m unittest discover -s tests -p test_revimg.py -v

      - name: Build icon and executables
        run: |
          python packaging/make_icon.py
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/cli packaging/revimg.spec
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/gui packaging/revimg_gui.spec

      - name: Smoke test command line
        run: |
          dist/revimg.exe --version
          dist/revimg.exe selftest

      - name: Smoke test GUI
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/revimg-gui.exe").Path
          $report = Join-Path (Get-Location) "dist/gui-selftest.txt"
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.Arguments = "--selftest `"$report`""
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          if (-not $proc.WaitForExit(180000)) { $proc.Kill(); throw "GUI self-test timed out" }
          Get-Content $report
          if ($proc.ExitCode -ne 0) { throw "GUI self-test failed ($($proc.ExitCode))" }
          Remove-Item $report

      - name: Package zips
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/LICENSE -Force
          Copy-Item README.md dist/README.md -Force
          Copy-Item assets dist/assets -Recurse -Force
          Compress-Archive -Path dist/revimg.exe, dist/LICENSE, dist/README.md, dist/assets `
            -DestinationPath "dist/revimg-${{ github.ref_name }}-win64.zip" -CompressionLevel Optimal
          Compress-Archive -Path dist/revimg-gui.exe, dist/LICENSE, dist/README.md, dist/assets `
            -DestinationPath "dist/revimg-gui-${{ github.ref_name }}-win64.zip" -CompressionLevel Optimal
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: revimg-windows
          path: dist/*.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          generate_release_notes: true
