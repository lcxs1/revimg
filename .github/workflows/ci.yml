name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

      - name: Acceptance gate
        run: |
          python -c "import sys; sys.path.insert(0, 'demo')
          from make_photo import make_photo
          make_photo(2000, 2000, seed=33).save('carrier_source.png')"
          python -m revimg bench carrier_source.png -p acceptance-baseline --acceptance
